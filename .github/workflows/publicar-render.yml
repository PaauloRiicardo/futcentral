# Publica o FutCentral no Render a cada push na main, chamando o Deploy Hook do Render.
# O link do hook fica no segredo RENDER_DEPLOY_HOOK do GitHub (nunca no código):
# Settings > Secrets and variables > Actions > New repository secret.
name: Publicar no Render

on:
  push:
    branches: [main]
    paths-ignore:                        # mudanças que não alteram o site não geram deploy
      - "**.md"
      - ".github/workflows/manter-acordado.yml"
      - ".github/workflows/listar-jogos.yml"
      - ".github/workflows/medir-site.yml"
  workflow_dispatch:                     # botão "Run workflow" para publicar na hora

permissions:
  contents: write                        # para salvar o CSS gerado no repositório

concurrency:                             # dois pushes seguidos: só o último publica
  group: publicar-render
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # Gera static/site.css só com as classes do Tailwind que a página usa (poucos KB),
      # no lugar do Tailwind pelo CDN, que travava a página ~1,6 s no celular.
      - name: Gerar CSS (Tailwind 3)
        run: |
          npx --yes tailwindcss@3.4.17 -i estilos/entrada.css -o static/site.css --content site_esportivo.html --minify
          VERSAO=$(sha256sum static/site.css | cut -c1-10)
          sed -i -E "s#/static/site\.css\?v=[A-Za-z0-9]+#/static/site.css?v=$VERSAO#" site_esportivo.html
          echo "CSS: $(wc -c < static/site.css) bytes, versão $VERSAO"

      - name: Salvar o CSS no repositório (se mudou)
        run: |
          if git diff --quiet -- static/site.css site_esportivo.html && [ -z "$(git status --porcelain -- static/site.css)" ]; then
            echo "CSS sem mudança."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/site.css site_esportivo.html
          git commit -m "CSS gerado (automático)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Avisar o Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Segredo RENDER_DEPLOY_HOOK não cadastrado no GitHub."
            exit 1
          fi
          codigo=$(curl -sS -X POST --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -o /dev/null -w "%{http_code}" "$HOOK")
          echo "Render respondeu HTTP $codigo"
          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "::error::O Render recusou o deploy (HTTP $codigo). Confira se o segredo tem o Deploy Hook atual."
            exit 1
          fi
          echo "Deploy iniciado. Acompanhe em Events no painel do Render (leva de 2 a 5 min)."

# Blueprint do Render: plano gratuito, publica em https://futcentral.onrender.com
# (se o nome já estiver em uso, o Render acrescenta um sufixo ao endereço)
services:
  - type: web
    name: futcentral
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->

          <svg class="block w-5 h-5" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M417.3 360.1l-71.6-4.8c-5.2-.3-10.3 1.1-14.5 4.2s-7.2 7.4-8.4 12.5l-17.6 69.6C289.5 445.8 273 448 256 448s-33.5-2.2-49.2-6.4L189.2 372c-1.3-5-4.3-9.4-8.4-12.5s-9.3-4.5-14.5-4.2l-71.6 4.8c-17.6-27.2-28.5-59.2-30.4-93.6L125 228.3c4.4-2.8 7.6-7 9.2-11.9s1.4-10.2-.5-15l-26.7-66.6C128 109.2 155.3 89 186.7 76.9l55.2 46c4 3.3 9 5.1 14.1 5.1s10.2-1.8 14.1-5.1l55.2-46c31.3 12.1 58.7 32.3 79.6 57.9l-26.7 66.6c-1.9 4.8-2.1 10.1-.5 15s4.9 9.1 9.2 11.9l60.7 38.2c-1.9 34.4-12.8 66.4-30.4 93.6zM256 512a256 256 0 1 0 0-512 256 256 0 1 0 0 512zm14.1-325.7c-8.4-6.1-19.8-6.1-28.2 0L194 221c-8.4 6.1-11.9 16.9-8.7 26.8l18.3 56.3c3.2 9.9 12.4 16.6 22.8 16.6l59.2 0c10.4 0 19.6-6.7 22.8-16.6l18.3-56.3c3.2-9.9-.3-20.7-8.7-26.8l-47.9-34.8z"/></svg>

  <!-- Filtros -->
  <section class="bg-gray-900/50 border-b border-gray-800 backdrop-blur-sm">

  <!-- Conteúdo Principal -->

      <!-- Cards fantasma enquanto os jogos carregam (mesmo tamanho dos cards reais) -->
      <div class="card-fantasma"></div><div class="card-fantasma"></div><div class="card-fantasma"></div>
    </div>
  </main>

  <footer class="bg-gray-900 border-t border-gray-800 text-center text-xs text-gray-400 py-4">
    <p>FutCentral © 2026 - Onde assistir aos principais campeonatos do mundo.</p>
  </footer>

  <script>
    // Ícones do Font Awesome Free (CC BY 4.0, fontawesome.com) embutidos como SVG:
    // a página não baixa mais a biblioteca inteira só para usar 7 ícones.
    const ICONES = {"futbol": {"vb": "0 0 512 512", "d": "M417.3 360.1l-71.6-4.8c-5.2-.3-10.3 1.1-14.5 4.2s-7.2 7.4-8.4 12.5l-17.6 69.6C289.5 445.8 273 448 256 448s-33.5-2.2-49.2-6.4L189.2 372c-1.3-5-4.3-9.4-8.4-12.5s-9.3-4.5-14.5-4.2l-71.6 4.8c-17.6-27.2-28.5-59.2-30.4-93.6L125 228.3c4.4-2.8 7.6-7 9.2-11.9s1.4-10.2-.5-15l-26.7-66.6C128 109.2 155.3 89 186.7 76.9l55.2 46c4 3.3 9 5.1 14.1 5.1s10.2-1.8 14.1-5.1l55.2-46c31.3 12.1 58.7 32.3 79.6 57.9l-26.7 66.6c-1.9 4.8-2.1 10.1-.5 15s4.9 9.1 9.2 11.9l60.7 38.2c-1.9 34.4-12.8 66.4-30.4 93.6zM256 512a256 256 0 1 0 0-512 256 256 0 1 0 0 512zm14.1-325.7c-8.4-6.1-19.8-6.1-28.2 0L194 221c-8.4 6.1-11.9 16.9-8.7 26.8l18.3 56.3c3.2 9.9 12.4 16.6 22.8 16.6l59.2 0c10.4 0 19.6-6.7 22.8-16.6l18.3-56.3c3.2-9.9-.3-20.7-8.7-26.8l-47.9-34.8z"}, "magnifying-glass": {"vb": "0 0 512 512", "d": "M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376C296.3 401.1 253.9 416 208 416 93.1 416 0 322.9 0 208S93.1 0 208 0 416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"}, "calendar-xmark": {"vb": "0 0 448 512", "d": "M128 0c17.7 0 32 14.3 32 32l0 32 128 0 0-32c0-17.7 14.3-32 32-32s32 14.3 32 32l0 32 32 0c35.3 0 64 28.7 64 64l0 288c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 128C0 92.7 28.7 64 64 64l32 0 0-32c0-17.7 14.3-32 32-32zM291.9 220.1c-9.4-9.4-24.6-9.4-33.9 0l-33.9 33.9-33.9-33.9c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l33.9 33.9-33.9 33.9c-9.4 9.4-9.4 24.6 0 33.9s24.6 9.4 33.9 0l33.9-33.9 33.9 33.9c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9l-33.9-33.9 33.9-33.9c9.4-9.4 9.4-24.6 0-33.9z"}, "circle-exclamation": {"vb": "0 0 512 512", "d": "M256 512a256 256 0 1 1 0-512 256 256 0 1 1 0 512zm0-192a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.6 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z"}, "rotate-right": {"vb": "0 0 512 512", "d": "M488 192l-144 0c-9.7 0-18.5-5.8-22.2-14.8s-1.7-19.3 5.2-26.2l46.7-46.7c-75.3-58.6-184.3-53.3-253.5 15.9-75 75-75 196.5 0 271.5s196.5 75 271.5 0c8.2-8.2 15.5-16.9 21.9-26.1 10.1-14.5 30.1-18 44.6-7.9s18 30.1 7.9 44.6c-8.5 12.2-18.2 23.8-29.1 34.7-100 100-262.1 100-362 0S-25 175 75 75c94.3-94.3 243.7-99.6 344.3-16.2L471 7c6.9-6.9 17.2-8.9 26.2-5.2S512 14.3 512 24l0 144c0 13.3-10.7 24-24 24z"}, "triangle-exclamation": {"vb": "0 0 512 512", "d": "M256 0c14.7 0 28.2 8.1 35.2 21l216 400c6.7 12.4 6.4 27.4-.8 39.5S486.1 480 472 480L40 480c-14.1 0-27.2-7.4-34.4-19.5s-7.5-27.1-.8-39.5l216-400c7-12.9 20.5-21 35.2-21zm0 352a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.5 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z"}, "tv": {"vb": "0 0 576 512", "d": "M64 96l0 240 448 0 0-240-448 0zM0 96C0 60.7 28.7 32 64 32l448 0c35.3 0 64 28.7 64 64l0 240c0 35.3-28.7 64-64 64L64 400c-35.3 0-64-28.7-64-64L0 96zM160 448l256 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-256 0c-17.7 0-32-14.3-32-32s14.3-32 32-32z"}};
    function icone(nome, classes = '') {
      const i = ICONES[nome];
      return `<svg class="inline-block w-[1em] h-[1em] align-[-0.125em] ${classes}" viewBox="${i.vb}" fill="currentColor" aria-hidden="true"><path d="${i.d}"/></svg>`;
    }

    // Cards fantasma: ocupam o mesmo espaço dos cards reais enquanto a lista carrega
    const CARDS_FANTASMA = '<div class="card-fantasma"></div>'.repeat(3);

    // Aberto pelo servidor, usa o mesmo endereço; aberto direto do arquivo, usa o backend local
    const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';

    // Data de hoje no fuso do navegador (toISOString usaria UTC e viraria o dia às 21h no Brasil)
    function dataLocal(d = new Date()) {
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // Escapa textos vindos da API antes de colocar no HTML (evita XSS)
    function esc(texto) {
      return String(texto ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.getElementById('dateInput').value = dataLocal();

    // Atualização automática: a cada 60 s, só para a data de hoje ou se houver jogo em andamento,
    // e só com a aba visível (aba escondida não gasta internet nem consultas à ESPN)
    const INTERVALO_ATUALIZACAO = 60 * 1000;
    let timerAtualizacao = null;
    let requisicaoAtual = 0;

    function precisaAtualizar(data) {
      return data === dataLocal() || jogosDoDia.some(jogo => jogo.estado === 'in');
    }

    function agendarAtualizacao(data) {
      clearTimeout(timerAtualizacao);
      timerAtualizacao = null;
      if (!precisaAtualizar(data)) return;
      timerAtualizacao = setTimeout(() => {
        timerAtualizacao = null;
        if (document.hidden) return; // retoma quando a aba voltar a ficar visível
        carregarJogosDoBackend(data, true);
      }, INTERVALO_ATUALIZACAO);
    }

    document.addEventListener('visibilitychange', () => {
      const data = document.getElementById('dateInput').value;
      if (!document.hidden && timerAtualizacao === null && precisaAtualizar(data)) {
        carregarJogosDoBackend(data, true);
      }
    });

    // Selo do topo: verde pulsando quando atualiza sozinho, cinza quando não precisa, amarelo se falhou
    function atualizarSelo(data, ok) {
      const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const [classe, ponto, texto] = !ok
        ? ['bg-yellow-500/10 text-yellow-300 border-yellow-500/30', 'bg-yellow-400 animate-pulse', 'Sem conexão · tentando de novo']
        : precisaAtualizar(data)
          ? ['bg-green-500/10 text-green-400 border-green-500/20', 'bg-green-400 animate-pulse', `Ao vivo · atualizado ${hora}`]
          : ['bg-gray-800 text-gray-400 border-gray-700', 'bg-gray-500', `Atualizado às ${hora}`];
      document.getElementById('selo').className = `flex items-center space-x-2 text-xs border px-3 py-1.5 rounded-full ${classe}`;
      document.getElementById('seloPonto').className = `w-2 h-2 rounded-full ${ponto}`;
      document.getElementById('seloTexto').textContent = texto;
    }

    // silencioso = atualização automática: sem tela de "Carregando", mantém a lista se falhar
    async function carregarJogosDoBackend(data, silencioso = false) {
      const minhaRequisicao = ++requisicaoAtual;
      const container = document.getElementById('container-jogos');
      const aviso = document.getElementById('aviso');
      if (!silencioso) {
        container.innerHTML = CARDS_FANTASMA;
        container.setAttribute('aria-busy', 'true');
        aviso.classList.add('hidden');
      }

      try {
        const resposta = await fetch(`${API_BASE}/api/jogos?data=${encodeURIComponent(data)}`, { cache: 'no-store' });
        const resultado = await resposta.json().catch(() => ({}));
        // O usuário trocou de data enquanto esta busca rodava: ignora a resposta antiga
        if (minhaRequisicao !== requisicaoAtual) return;

        // Erro do servidor ou da ESPN: mostra o erro, nunca "Nenhum jogo encontrado"
        if (!resposta.ok || resultado.status === 'erro') {
          throw new Error(resultado.mensagem || `Erro ${resposta.status}`);
        }

        // Algumas ligas falharam: mostra o que veio e avisa que pode faltar jogo
        if (resultado.status === 'parcial') {
          const ligas = (resultado.ligasComFalha || []).join(', ');
          aviso.innerHTML = `${icone('circle-exclamation', 'mr-1')} Alguns campeonatos não carregaram${ligas ? ` (${esc(ligas)})` : ''}. A lista pode estar incompleta. <button onclick="carregarJogosDoBackend(document.getElementById('dateInput').value)" class="underline font-semibold ml-1">Recarregar</button>`;
          aviso.classList.remove('hidden');
        } else {
          aviso.classList.add('hidden');
        }

        jogosDoDia = resultado.dados || [];
        aplicarFiltros();
        atualizarSelo(data, true);

      } catch (erro) {
        if (minhaRequisicao !== requisicaoAtual) return;
        console.error("Erro ao carregar os jogos:", erro);
        container.setAttribute('aria-busy', 'false');
        atualizarSelo(data, false);
        // Falha numa atualização automática: mantém os placares que já estão na tela
        if (silencioso && jogosDoDia.length) return;
        jogosDoDia = [];
        container.innerHTML = `
          <div class="text-center py-12 text-red-400">
            ${icone('triangle-exclamation', 'text-3xl mb-2')}
            <p>${esc(erro.message && !erro.message.startsWith('Failed') ? erro.message : 'Não foi possível carregar os jogos. Tente novamente em instantes.')}</p>
            <button onclick="carregarJogosDoBackend(document.getElementById('dateInput').value)"
              class="mt-4 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg text-sm">
              ${icone('rotate-right', 'mr-1')} Tentar novamente
            </button>
          </div>`;
      } finally {
        // Agenda a próxima atualização (também depois de erro, para tentar de novo sozinho)
        if (minhaRequisicao === requisicaoAtual) agendarAtualizacao(data);
      }
    }

    // Gols e cartões vermelhos abaixo de cada time: "Bruno Duarte 36', 81'"
    // (o mesmo jogador fica numa linha só; pênalti e gol contra aparecem entre parênteses)
    const ICONE_LANCE = {
      gol: icone('futbol', 'text-gray-400 text-[11px]'),
      vermelho: '<span class="inline-block w-2 h-3 bg-red-500 rounded-sm align-[-1px]" title="Cartão vermelho"></span>',
    };

    function montarLances(lances) {
      if (!lances || lances.length === 0) return '';
      const colunas = { mandante: [], visitante: [] };
      const grupos = new Map();
      lances.forEach(l => {
        const chave = `${l.lado}|${l.tipo}|${l.jogador}`;
        const minuto = l.minuto + (l.penalti ? ' (pên.)' : '') + (l.contra ? ' (contra)' : '');
        if (grupos.has(chave)) { grupos.get(chave).minutos.push(minuto); return; }
        const grupo = { ...l, minutos: [minuto] };
        grupos.set(chave, grupo);
        (colunas[l.lado] || []).push(grupo);
      });
      const linha = (g, lado) => {
        const texto = `${esc(g.jogador || 'Não informado')} <span class="text-gray-400 whitespace-nowrap">${esc(g.minutos.join(', '))}</span>`;
        return lado === 'mandante'
          ? `<li class="flex items-center justify-end gap-1.5"><span>${texto}</span>${ICONE_LANCE[g.tipo]}</li>`
          : `<li class="flex items-center gap-1.5">${ICONE_LANCE[g.tipo]}<span>${texto}</span></li>`;
      };
      return `
          <div class="grid grid-cols-2 gap-x-6 text-xs text-gray-300 -mt-1 pb-1">
            <ul class="space-y-0.5 text-right">${colunas.mandante.map(g => linha(g, 'mandante')).join('')}</ul>
            <ul class="space-y-0.5">${colunas.visitante.map(g => linha(g, 'visitante')).join('')}</ul>
          </div>`;
    }

    function renderizarJogos(lista) {
      const container = document.getElementById('container-jogos');
      container.innerHTML = '';
      container.setAttribute('aria-busy', 'false');

      if (!lista || lista.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-400">
            ${icone('calendar-xmark', 'text-4xl mb-3')}
            <p>Nenhum jogo encontrado para esta data ou filtro.</p>
          </div>`;
        return;
      }

      lista.forEach(jogo => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-xl p-4 hover:border-gray-700 transition shadow-lg space-y-3";
        
        const canais = jogo.transmissao || [];
        const canaisHtml = canais.length
          ? canais.map(canal =>
              `<span class="bg-green-500/10 text-green-400 border border-green-500/20 px-2 py-0.5 rounded text-xs font-semibold">${esc(canal)}</span>`
            ).join(' ')
          : `<span class="text-gray-400 italic">Transmissão a confirmar</span>`;

        // Antes do jogo mostra "VS"; durante e depois, o placar
        const temPlacar = jogo.estado !== 'pre' && jogo.placarMandante != null && jogo.placarVisitante != null;
        const meioHtml = temPlacar
          ? `<div class="px-4 text-xl font-black tabular-nums ${jogo.estado === 'in' ? 'text-green-400' : 'text-white'}">${esc(jogo.placarMandante)} <span class="text-gray-400">x</span> ${esc(jogo.placarVisitante)}</div>`
          : `<div class="px-4 text-xs font-black text-gray-400 uppercase">VS</div>`;
        const statusClasse = jogo.estado === 'in' ? 'bg-green-500/15 text-green-400' : 'bg-gray-800 text-gray-300';
        const lancesHtml = temPlacar ? montarLances(jogo.lances) : '';

        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-800 pb-2">
            <span class="text-xs font-bold text-green-400 uppercase tracking-wider">${esc(jogo.liga)}</span>
            <span class="text-xs ${statusClasse} px-2 py-1 rounded font-mono">${esc(jogo.horario)} - ${esc(jogo.status)}</span>
          </div>

          <div class="flex items-center justify-between py-2">
            <div class="flex-1 text-right font-bold text-base text-gray-100">${esc(jogo.mandante)}</div>
            ${meioHtml}
            <div class="flex-1 text-left font-bold text-base text-gray-100">${esc(jogo.visitante)}</div>
          </div>
          ${lancesHtml}

          <div class="flex items-center justify-between pt-2 border-t border-gray-800/60 text-xs">
            <span class="text-gray-400 flex items-center gap-1.5">
              ${icone('tv', 'text-gray-400')} Onde assistir:
            </span>
            <div class="flex gap-1.5 flex-wrap justify-end">
              ${canaisHtml}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Jogos da data carregada e filtros escolhidos; filtrar não chama o backend de novo
    let jogosDoDia = [];
    let regiaoAtual = 'todos';

    // Minúsculas e sem acentos, para "sao paulo" achar "São Paulo"
    function normalizar(texto) {
      return String(texto ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    function aplicarFiltros() {
      const busca = normalizar(document.getElementById('searchInput').value.trim());
      const filtrados = jogosDoDia.filter(jogo => {
        // Um jogo pode estar em mais de uma aba (ex.: Japão x Brasil em Seleções e em Brasil)
        if (regiaoAtual !== 'todos' && !(jogo.regioes || [jogo.regiao]).includes(regiaoAtual)) return false;
        if (!busca) return true;
        return [jogo.mandante, jogo.visitante, jogo.liga, jogo.pais].some(campo => normalizar(campo).includes(busca));
      });
      renderizarJogos(filtrados);
    }

    function filtrarRegiao(regiao) {
      regiaoAtual = regiao;
      document.querySelectorAll('.btn-filtro').forEach(btn => {
        const ativo = btn.dataset.regiao === regiao;
        btn.classList.toggle('bg-green-500', ativo);
        btn.classList.toggle('text-gray-950', ativo);
        btn.classList.toggle('bg-gray-800', !ativo);
        btn.classList.toggle('text-gray-300', !ativo);
      });
      aplicarFiltros();
    }

    document.getElementById('searchInput').addEventListener('input', aplicarFiltros);

    function carregarJogosData(data) {
      carregarJogosDoBackend(data);
    }

    carregarJogosDoBackend(dataLocal());
  </script>
</body>
</html>

# Lista os jogos de uma data, como o site mostra (nomes exatos dos times e canais atuais).
# Usada pela tarefa agendada do Claude que cadastra os canais do dia no canais.json,
# porque o ambiente do Claude não acessa o site nem a ESPN diretamente.
name: Listar jogos do dia

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data AAAA-MM-DD (vazio = hoje, horário de Brasília)"
        required: false
        default: ""

permissions: {}

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Buscar jogos no FutCentral
        env:
          DATA_ENTRADA: ${{ inputs.data }}
        run: |
          DATA="${DATA_ENTRADA:-$(TZ=America/Sao_Paulo date +%F)}"
          if ! [[ "$DATA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Data inválida: $DATA (use AAAA-MM-DD)"; exit 1
          fi
          echo "DATA|$DATA"
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            "https://futcentral.onrender.com/api/jogos?data=$DATA" -o jogos.json
          echo "STATUS|$(jq -r '.status' jogos.json)|falhas: $(jq -r '(.ligasComFalha // []) | join(", ")' jogos.json)"
          # Uma linha por jogo: JOGO|liga|horário|mandante|visitante|canais atuais
          jq -r '.dados[] | "JOGO|\(.liga)|\(.horario)|\(.mandante)|\(.visitante)|\(.transmissao | join("; "))"' jogos.json
          echo "TOTAL|$(jq '.dados | length' jogos.json)"
